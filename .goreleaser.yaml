version: 2

project_name: pourover

before:
  hooks:
    - go mod tidy

builds:
  - id: pourover
    main: ./cmd/pourover
    binary: pourover
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/chasebank87/PourOver/internal/version.Version={{.Version}} -X github.com/chasebank87/PourOver/internal/version.Commit={{.ShortCommit}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
